<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Directory — ALUMights</title>
    <meta name="description"
        content="Search and discover alumni across colleges, courses, and graduation years on ALUMights.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="css/common.css">
    <style>
        .directory-page {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: var(--sp-xl) var(--sp-lg);
        }

        .page-header {
            text-align: center;
            margin-bottom: var(--sp-2xl);
            animation: fadeInDown 0.5s var(--ease-smooth);
        }

        .page-header h1 {
            font-family: var(--ff-display);
            font-size: var(--fs-3xl);
            color: var(--clr-text-heading);
            margin-bottom: var(--sp-sm);
        }

        .page-header h1 span {
            color: var(--clr-accent);
            font-style: italic;
        }

        .page-header p {
            color: var(--clr-text-muted);
            font-size: var(--fs-md);
        }

        /* Filters */
        .filters-bar {
            padding: var(--sp-lg);
            margin-bottom: var(--sp-xl);
        }

        .filters-row {
            display: flex;
            gap: var(--sp-md);
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-search {
            flex: 1;
            min-width: 240px;
            position: relative;
        }

        .filter-search i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--clr-text-dim);
        }

        .filter-search input {
            padding-left: 2.5rem;
        }

        .filter-select {
            min-width: 160px;
        }

        .results-count {
            font-size: var(--fs-sm);
            color: var(--clr-text-muted);
            margin-bottom: var(--sp-lg);
        }

        .results-count strong {
            color: var(--clr-accent-light);
        }

        /* Alumni Grid */
        .alumni-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--sp-lg);
        }

        .alumni-card {
            padding: var(--sp-xl);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }

        .alumni-card .avatar {
            margin-bottom: var(--sp-md);
            transition: box-shadow var(--transition-base);
        }

        .alumni-card:hover .avatar {
            box-shadow: var(--shadow-glow);
        }

        .alumni-card h3 {
            font-family: var(--ff-display);
            font-size: var(--fs-md);
            color: var(--clr-text-heading);
            margin-bottom: 4px;
        }

        .alumni-card .alumni-username {
            font-size: var(--fs-xs);
            color: var(--clr-text-dim);
            margin-bottom: var(--sp-sm);
        }

        .alumni-card .alumni-college {
            font-size: var(--fs-sm);
            color: var(--clr-text-muted);
        }

        .alumni-card .alumni-tags {
            display: flex;
            gap: var(--sp-xs);
            flex-wrap: wrap;
            justify-content: center;
            margin-top: var(--sp-md);
        }

        .alumni-card .alumni-bio {
            font-size: var(--fs-xs);
            color: var(--clr-text-dim);
            margin-top: var(--sp-sm);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .alumni-card .view-profile-btn {
            margin-top: var(--sp-lg);
            width: 100%;
        }

        .empty-results {
            text-align: center;
            padding: var(--sp-3xl);
            color: var(--clr-text-dim);
            grid-column: 1 / -1;
        }

        .empty-results i {
            font-size: 3rem;
            margin-bottom: var(--sp-md);
        }
    </style>
</head>

<body>
    <div id="navbar-mount"></div>

    <div class="directory-page">
        <div class="page-header">
            <h1>Alumni <span>Directory</span></h1>
            <p>Discover and connect with alumni across colleges and generations</p>
        </div>

        <div class="filters-bar glass">
            <div class="filters-row">
                <div class="filter-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" class="form-control" id="search-input"
                        placeholder="Search by name, username, or college...">
                </div>
                <select class="form-control filter-select" id="filter-course">
                    <option value="">All Courses</option>
                </select>
                <select class="form-control filter-select" id="filter-year">
                    <option value="">All Years</option>
                </select>
                <select class="form-control filter-select" id="filter-college">
                    <option value="">All Colleges</option>
                </select>
            </div>
        </div>

        <div class="results-count" id="results-count"></div>

        <div class="alumni-grid" id="alumni-grid">
            <!-- Rendered by JS -->
        </div>
    </div>

    <div id="footer-mount"></div>

    <script src="js/auth.js"></script>
    <script src="js/captcha.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/feed.js"></script>
    <script>
        Auth.seedSampleUsers();
        Feed.seedSamplePosts();
        Utils.initPage('directory');

        const allUsers = Auth.getUsers();

        // Populate filter dropdowns
        function populateFilters() {
            const courses = [...new Set(allUsers.map(u => u.course).filter(Boolean))].sort();
            const years = [...new Set(allUsers.map(u => u.gradYear).filter(Boolean))].sort().reverse();
            const colleges = [...new Set(allUsers.map(u => u.college).filter(Boolean))].sort();

            const courseSelect = document.getElementById('filter-course');
            courses.forEach(c => courseSelect.innerHTML += `<option value="${c}">${c}</option>`);

            const yearSelect = document.getElementById('filter-year');
            years.forEach(y => yearSelect.innerHTML += `<option value="${y}">Class of ${y}</option>`);

            const collegeSelect = document.getElementById('filter-college');
            colleges.forEach(c => collegeSelect.innerHTML += `<option value="${c}">${c}</option>`);
        }

        function filterAndRender() {
            const search = document.getElementById('search-input').value.toLowerCase().trim();
            const course = document.getElementById('filter-course').value;
            const year = document.getElementById('filter-year').value;
            const college = document.getElementById('filter-college').value;

            let filtered = allUsers.filter(u => {
                const matchSearch = !search ||
                    u.fullName.toLowerCase().includes(search) ||
                    u.username.toLowerCase().includes(search) ||
                    (u.college && u.college.toLowerCase().includes(search));
                const matchCourse = !course || u.course === course;
                const matchYear = !year || u.gradYear === year;
                const matchCollege = !college || u.college === college;
                return matchSearch && matchCourse && matchYear && matchCollege;
            });

            document.getElementById('results-count').innerHTML =
                `Showing <strong>${filtered.length}</strong> of ${allUsers.length} alumni`;

            const grid = document.getElementById('alumni-grid');

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-results">
                        <i class="fa-solid fa-users-slash"></i>
                        <h3 style="color:var(--clr-text-heading); margin-bottom:var(--sp-sm);">No alumni found</h3>
                        <p>Try adjusting your search or filters</p>
                    </div>`;
                return;
            }

            grid.innerHTML = filtered.map((u, i) => `
                <div class="alumni-card glass animate-in" style="animation-delay: ${i * 0.05}s" onclick="window.location.href='profile.html?id=${u.id}'">
                    <div class="avatar avatar-lg">${Utils.getInitials(u.fullName)}</div>
                    <h3>${Utils.escapeHTML(u.fullName)}</h3>
                    <p class="alumni-username">@${Utils.escapeHTML(u.username)}</p>
                    <p class="alumni-college">${Utils.escapeHTML(u.college || 'Unknown College')}</p>
                    <div class="alumni-tags">
                        ${u.course ? `<span class="badge">${Utils.escapeHTML(u.course)}</span>` : ''}
                        ${u.gradYear ? `<span class="badge badge-success">Class of ${u.gradYear}</span>` : ''}
                    </div>
                    ${u.bio ? `<p class="alumni-bio">${Utils.escapeHTML(u.bio)}</p>` : ''}
                    <a class="btn btn-secondary btn-sm view-profile-btn">View Profile →</a>
                </div>
            `).join('');
        }

        // Event listeners
        document.getElementById('search-input').addEventListener('input', filterAndRender);
        document.getElementById('filter-course').addEventListener('change', filterAndRender);
        document.getElementById('filter-year').addEventListener('change', filterAndRender);
        document.getElementById('filter-college').addEventListener('change', filterAndRender);

        // Check for URL search param
        const urlParams = new URLSearchParams(window.location.search);
        const q = urlParams.get('q');
        if (q) document.getElementById('search-input').value = q;

        populateFilters();
        filterAndRender();
    </script>
</body>

</html>
